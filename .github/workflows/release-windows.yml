# Builds the Windows installer and a portable zip, and attaches them to a GitHub release.
# Runs for a pushed tag v*, or by hand (Actions -> Release for Windows -> Run workflow).
name: Release for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0 (created from the chosen branch if missing)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          $v = (Select-String -Path salt_music\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG does not match __version__ $v" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build
        shell: pwsh
        run: |
          python -m venv .build-venv   # build.ps1 reuses it instead of looking for the py launcher
          powershell -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SaltMusic -DestinationPath "dist\SaltMusic-$env:VERSION-portable.zip"

      - name: Checksums
        shell: pwsh
        run: |
          # collect first: the sums file must not be listed (and locked) while it is written
          $sums = Get-ChildItem dist\* -File -Exclude SHA256SUMS.txt | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          if (-not $sums) { throw "nothing to hash" }
          $sums | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("dist\SaltMusic-Setup-$env:VERSION.exe", "dist\SaltMusic-$env:VERSION-portable.zip", "dist\SHA256SUMS.txt")
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            (Get-Content -Raw -Encoding utf8 installer\RELEASE_NOTES.md).Replace('{version}', $env:VERSION) |
              Out-File -Encoding utf8 dist\notes.md
            gh release create $env:TAG @files --title "Salt Music $env:VERSION" --target $env:GITHUB_SHA --notes-file dist\notes.md
          }
          if ($LASTEXITCODE) { throw "gh release failed" }
